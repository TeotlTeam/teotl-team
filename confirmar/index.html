<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Abriendo WhatsApp…</title>
<style>
  html, body { margin:0; height:100%; }
  body {
    background:#000; color:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box;
  }
  .spinner {
    width:34px; height:34px; border:3px solid #333; border-top-color:#FEA500; border-radius:50%;
    animation:spin .8s linear infinite; margin-bottom:18px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { margin:0 0 20px 0; font-size:17px; }
  .brand { color:#FEA500; font-weight:bold; letter-spacing:2px; font-size:12px; margin-bottom:26px; text-transform:uppercase; }
  a.btn {
    display:inline-block; padding:13px 26px; background:#25D366; color:#fff; border-radius:8px;
    text-decoration:none; font-weight:bold; font-size:15px;
  }
  .small { margin-top:16px; font-size:12px; color:#8a8477; }
  .small a { color:#FEA500; }
</style>
</head>
<body>
  <div class="brand">Teotl Team</div>
  <div class="spinner" aria-hidden="true"></div>
  <p>Abriendo WhatsApp…</p>
  <a id="manual" class="btn" href="https://wa.me/">Toca aquí si no se abre solo</a>
  <div class="small">Tu confirmación quedó registrada. <a id="home" href="../">Ir al sitio</a></div>

<script>
(function () {
  // ─── CONFIGURACIÓN (se edita una sola vez) ────────────────────────────────
  // URL /exec de tu Apps Script (apps-script/confirmRedirect.gs). Si se deja
  // sin configurar, la página igual manda a WhatsApp, pero no registra.
  var LOGGER_URL = 'https://script.google.com/macros/s/AKfycbzpv_iIzBj1ZJdRzk1vJRiYD0adL5gwASiN5ZGq5PdfEqSVeC2hHNVNDvY3sxv4WiZb/exec';

  // Número de WhatsApp de Teotl Team, solo dígitos y con código de país
  // (ej. 525512345678). Debe ser el MISMO valor que la variable
  // WHATSAPP_NUMBER del proyecto de automatización. Vive aquí (y no en el
  // enlace del correo) para que el enlace no lleve el número.
  var WHATSAPP_NUMBER = '5577858914';

  // A dónde se manda a la persona cuando regresa de WhatsApp, o si el enlace
  // llega incompleto/inválido. '../' = el inicio del sitio, porque esta página
  // vive en la carpeta confirmar/ (cambia, por ejemplo, a '../seguimiento.html'
  // si prefieres otra página de destino).
  var HOME_URL = '../';

  // Máximo que se espera a que el registro responda antes de mandar al
  // cliente a WhatsApp (el registro sigue en segundo plano aunque se acabe
  // este tiempo). Apps Script puede tardar 1-3 s en "despertar".
  var WAIT_MS = 1200;

  // Correos enviados ANTES de usar tokens llevan ?email=...&wa=... en el
  // enlace. Mientras esto esté en true, esos enlaces siguen funcionando.
  // Cuando ya no circulen correos viejos, ponlo en false (o borra el bloque
  // marcado "COMPATIBILIDAD").
  var LEGACY_LINKS = false;
  // ─────────────────────────────────────────────────────────────────────────

  var FLAG = 'teotl_confirm_opened';
  var RETURN_WINDOW_MS = 30 * 60 * 1000; // una "vuelta" solo cuenta dentro de 30 min

  function goHome() {
    try { sessionStorage.removeItem(FLAG); } catch (e) {}
    window.location.replace(HOME_URL);
  }

  // Marca que esta pestaña ya mandó a la persona a WhatsApp, para saber
  // distinguir "primera visita" de "volvió con el botón atrás".
  function markOpened() {
    try {
      sessionStorage.setItem(FLAG, JSON.stringify({ t: Date.now(), q: window.location.search }));
    } catch (e) {}
  }

  function cameBack() {
    try {
      var raw = sessionStorage.getItem(FLAG);
      if (!raw) return false;
      var f = JSON.parse(raw);
      return !!f && f.q === window.location.search && (Date.now() - f.t) < RETURN_WINDOW_MS;
    } catch (e) { return false; }
  }

  // 1) ¿Regresó de WhatsApp? (botón atrás, o volvió a esta pestaña) → inicio.
  //    Se revisa también al recuperar la página desde la caché del navegador.
  if (cameBack()) { goHome(); return; }
  window.addEventListener('pageshow', function (e) { if (e.persisted && cameBack()) goHome(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && cameBack()) goHome();
  });

  // Texto libre que llega por el enlace (fecha/hora): sin caracteres de
  // control y con largo máximo, porque solo se usa para redactar el mensaje.
  function clean(v) {
    return String(v || '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 60);
  }

  var params = new URLSearchParams(window.location.search);
  var token = params.get('t') || '';

  var target = '';       // enlace de WhatsApp al que se manda
  var sendLog = null;    // función que registra la confirmación (o null)

  if (token) {
    // ── Flujo actual ──
    // El enlace lleva solo un token aleatorio + fecha y hora (t, f, h). El
    // enlace de WhatsApp se arma AQUÍ, con el número fijo de arriba, así que
    // el único destino posible es wa.me/<tu número> (nadie puede usar esta
    // página para mandar a otro sitio).
    var fecha = clean(params.get('f'));
    var hora = clean(params.get('h'));
    var numeroOk = /^[0-9]{10,15}$/.test(WHATSAPP_NUMBER);
    var tokenOk = /^[A-Za-z0-9_-]{8,64}$/.test(token);

    // Enlace incompleto o inválido (o página sin configurar) → inicio.
    if (!numeroOk || !tokenOk || !fecha || !hora) { goHome(); return; }

    target = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' +
      encodeURIComponent('Hola. Confirmo mi asistencia a la sesión del ' + fecha + ' a las ' + hora + '.');

    // El token viaja en el CUERPO del POST, no en la URL.
    sendLog = function () {
      return fetch(LOGGER_URL, {
        method: 'POST',
        mode: 'no-cors',                                   // no necesitamos leer la respuesta
        keepalive: true,                                   // sigue aunque la página ya se haya ido
        cache: 'no-store',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ t: token })
      });
    };
  } else if (LEGACY_LINKS && (params.get('wa') || '').indexOf('https://wa.me/') === 0) {
    // ── COMPATIBILIDAD: correos enviados antes de usar tokens ──
    target = params.get('wa');
    var legacyEmail = params.get('email') || '';
    if (legacyEmail) {
      sendLog = function () {
        return fetch(LOGGER_URL + '?email=' + encodeURIComponent(legacyEmail), {
          mode: 'no-cors', keepalive: true, cache: 'no-store'
        });
      };
    }
  } else {
    // Sin token y sin enlace válido → inicio del sitio, sin registrar nada.
    goHome(); return;
  }

  var manual = document.getElementById('manual');
  manual.href = target;
  manual.addEventListener('click', markOpened); // el botón de respaldo también cuenta

  var done = false;
  function openWhatsApp() {
    if (done) return;
    done = true;
    markOpened();
    // href (no replace): así esta página queda en el historial y "atrás"
    // regresa aquí, donde se manda al inicio del sitio.
    window.location.href = target;
  }

  var canLog = LOGGER_URL.indexOf('https://script.google.com/') === 0 && sendLog;
  if (!canLog) { openWhatsApp(); return; }

  var timer = setTimeout(openWhatsApp, WAIT_MS);
  function finish() { clearTimeout(timer); openWhatsApp(); }

  try {
    sendLog().then(finish, finish);
  } catch (e) {
    finish();
  }
})();
</script>
</body>
</html>
